<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body><title>Группы щита ГИП</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Рабочая таблица инженера: плотная сетка, бренд-палитра gipproekt (синий/тёмно-синий), фазы — классические жёлтый/зелёный/красный */
:root {
  --bg: #f3f6fb;
  --surface: #ffffff;
  --surface-2: #f0f5fd;
  --surface-3: #e6eefb;
  --line: #d7e4f7;
  --line-strong: #b7cbea;
  --text: #0f2557;
  --muted: #5a6f95;
  --faint: #8798b6;
  --accent: #2563eb;
  --accent-ink: #ffffff;
  --accent-soft: #e5eeff;
  --navy: #123c7d;
  --blk: #edf3ff;
  --blk-line: #8fb0ef;
  --warn: #a15c07;
  --warn-bg: #fff3dc;
  --warn-line: #f0c27a;
  --bad: #b42318;
  --ok: #1d7a46;
  --ph1: #c39200;
  --ph2: #23935a;
  --ph3: #d33f3f;
  --lo-bg: #fff3cf; --lo-fg: #7d5200;
  --ls-bg: #e3edff; --ls-fg: #1847b8;
  --lao-bg: #ffe3e7; --lao-fg: #b0173a;
  --u-bg: #dfe9fb; --u-fg: #123c7d;
  --shadow: 0 10px 28px rgba(18, 60, 125, .14);
  --f-body: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
  --f-mono: "IBM Plex Mono", "Cascadia Mono", Consolas, "SFMono-Regular", Menlo, monospace;
  --r: 8px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c1424; --surface: #111c30; --surface-2: #15233b; --surface-3: #1b2b47;
    --line: #22355a; --line-strong: #2f4775; --text: #e2eaf8; --muted: #95a7c8; --faint: #6c7fa3;
    --accent: #5b8cff; --accent-ink: #081227; --accent-soft: #1a2c52; --navy: #a9c2ff;
    --blk: #142540; --blk-line: #3c63b3;
    --warn: #f3b54a; --warn-bg: #352610; --warn-line: #7a5a1f; --bad: #ff7b6e; --ok: #4cc785;
    --ph1: #e5b62c; --ph2: #45c27e; --ph3: #f07272;
    --lo-bg: #382c0e; --lo-fg: #f5cd6e; --ls-bg: #18294f; --ls-fg: #93b5ff; --lao-bg: #3e1823; --lao-fg: #ff9fb3;
    --u-bg: #1d3157; --u-fg: #bcd0ff; --shadow: 0 12px 30px rgba(0, 0, 0, .45);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c1424; --surface: #111c30; --surface-2: #15233b; --surface-3: #1b2b47;
  --line: #22355a; --line-strong: #2f4775; --text: #e2eaf8; --muted: #95a7c8; --faint: #6c7fa3;
  --accent: #5b8cff; --accent-ink: #081227; --accent-soft: #1a2c52; --navy: #a9c2ff;
  --blk: #142540; --blk-line: #3c63b3;
  --warn: #f3b54a; --warn-bg: #352610; --warn-line: #7a5a1f; --bad: #ff7b6e; --ok: #4cc785;
  --ph1: #e5b62c; --ph2: #45c27e; --ph3: #f07272;
  --lo-bg: #382c0e; --lo-fg: #f5cd6e; --ls-bg: #18294f; --ls-fg: #93b5ff; --lao-bg: #3e1823; --lao-fg: #ff9fb3;
  --u-bg: #1d3157; --u-fg: #bcd0ff; --shadow: 0 12px 30px rgba(0, 0, 0, .45);
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 14px/1.4 var(--f-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 40px;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.num, .mono { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--f-mono); }
.muted { color: var(--muted); }

/* ---------- верхняя строка */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  margin: 0 calc(-1 * max(16px, env(safe-area-inset-left, 0px))) 0 calc(-1 * max(16px, env(safe-area-inset-right, 0px)));
  padding: 10px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px));
  background: var(--surface); border-bottom: 1px solid var(--line);
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
}
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.mark {
  font: 700 12px/1 var(--f-mono); letter-spacing: .06em; color: var(--accent-ink); background: var(--navy);
  border-radius: 6px; padding: 6px 7px;
}
:root[data-theme="dark"] .mark { color: #0c1424; }
.brand h1 { margin: 0; font-size: 16px; font-weight: 700; letter-spacing: -.01em; white-space: nowrap; }
.brand .sub { color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.top .spacer { flex: 1 1 auto; }
.link { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.link .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); }
.link.on .dot { background: var(--ok); }

.btn {
  display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px;
  border: 1px solid var(--line-strong); background: var(--surface); border-radius: 7px;
  font-size: 13px; font-weight: 600; color: var(--text); white-space: nowrap;
}
.btn:hover { background: var(--surface-2); }
.btn:disabled { opacity: .45; cursor: default; background: var(--surface); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover { background: var(--surface-2); }
.btn.danger { color: var(--bad); }
.btn svg { width: 16px; height: 16px; flex: none; }
.btn.icon { width: 32px; padding: 0; justify-content: center; }
.kbd { font: 11px var(--f-mono); color: var(--faint); }

.hostbar { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 12px;
  background: var(--warn-bg); border: 1px solid var(--warn-line); color: var(--warn); font-size: 13px; }
.hostbar span { flex: 1 1 320px; min-width: 0; }
.top .chk { font-size: 12.5px; color: var(--muted); }

/* ---------- параметры щита */
.panel { margin-top: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
.board { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 10px 14px; padding: 12px 14px; }
.fld { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.fld > label, .fld > .lbl { font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
.fld input[type=text], .fld input:not([type]), .fld input[type=number], .fld select {
  height: 32px; border: 1px solid var(--line-strong); border-radius: 7px; background: var(--surface); padding: 0 8px; font-size: 13px; min-width: 0;
}
.fld input.w-s { width: 64px; } .fld input.w-m { width: 110px; } .fld input.w-l { width: 140px; }
.seg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 7px; overflow: hidden; height: 32px; }
.seg button { border: 0; background: var(--surface); padding: 0 10px; font-size: 13px; font-weight: 600; color: var(--muted); }
.seg button + button { border-left: 1px solid var(--line-strong); }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }
.checks { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; min-height: 32px; }
.chk { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; white-space: nowrap; cursor: pointer; }
.chk input { width: 15px; height: 15px; accent-color: var(--accent); margin: 0; }
.board .grow { flex: 1 1 auto; }
.kcbox { display: inline-flex; height: 32px; }
.kcbox input { border-radius: 7px 0 0 7px !important; }
.kcbox input.kc-auto { color: var(--accent); font-weight: 600; }
.kcbox input.kc-low { color: var(--warn); background: var(--warn-bg); }
.kcbox input.kc-bad { color: var(--bad); background: color-mix(in srgb, var(--bad) 12%, var(--surface)); }
.kcmode { border: 1px solid var(--line-strong); border-left: 0; border-radius: 0 7px 7px 0; background: var(--surface); padding: 0 9px; font-size: 12px; font-weight: 600; color: var(--muted); }
.kcmode[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }
.kcv-low { color: var(--warn) !important; } .kcv-bad { color: var(--bad) !important; }
.board .sep { width: 1px; align-self: stretch; background: var(--line); }

/* шаблон */
.tpl { border-top: 1px solid var(--line); padding: 12px 14px 14px; display: grid; gap: 12px; }
.tpl[hidden] { display: none !important; }
.tpl-row { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: flex-end; }
.stepper { display: inline-flex; align-items: center; border: 1px solid var(--line-strong); border-radius: 7px; height: 32px; overflow: hidden; }
.stepper button { border: 0; background: var(--surface); width: 28px; height: 100%; font-weight: 700; color: var(--muted); }
.stepper button:hover { background: var(--surface-2); }
.stepper output { min-width: 26px; text-align: center; font-weight: 600; font-variant-numeric: tabular-nums; }
.confirm { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 13px; color: var(--warn); background: var(--warn-bg); border: 1px solid var(--warn-line); border-radius: 8px; padding: 6px 8px 6px 12px; }
.mytpl { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.mytpl .t { display: inline-flex; align-items: center; gap: 2px; border: 1px solid var(--line-strong); border-radius: 999px; padding: 2px 4px 2px 10px; font-size: 13px; background: var(--surface-2); }
.mytpl .t button { border: 0; background: transparent; color: var(--muted); border-radius: 999px; height: 22px; padding: 0 6px; }
.mytpl .t button:hover { background: var(--surface-3); color: var(--text); }

/* ---------- сводка */
.sum { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; margin-top: 12px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px 12px; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.card h3 { margin: 0; font-size: 11px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.big { font-size: 22px; font-weight: 700; letter-spacing: -.01em; font-variant-numeric: tabular-nums; line-height: 1.15; }
.big small { font-size: 13px; font-weight: 600; color: var(--muted); }
.kv { display: flex; flex-wrap: wrap; gap: 2px 12px; font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.kv b { color: var(--text); font-weight: 600; }
.meter { height: 6px; border-radius: 3px; background: var(--surface-3); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
.meter.over i { background: var(--bad); }
.phases { display: grid; gap: 5px; }
.ph-row { display: grid; grid-template-columns: 24px 1fr 92px; align-items: center; gap: 8px; font-size: 12.5px; font-variant-numeric: tabular-nums; }
.ph-row .pbar { height: 8px; background: var(--surface-3); border-radius: 4px; overflow: hidden; }
.ph-row .pbar i { display: block; height: 100%; border-radius: 4px; }
.ph-row b { font-weight: 600; text-align: right; }
.pill { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; font-weight: 600; border-radius: 999px; padding: 1px 8px; letter-spacing: 0; text-transform: none; }
.pill.ok { color: var(--ok); background: color-mix(in srgb, var(--ok) 14%, transparent); }
.pill.warn { color: var(--warn); background: var(--warn-bg); }
.pill.bad { color: var(--bad); background: color-mix(in srgb, var(--bad) 14%, transparent); }
.card .acts { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 2px; }
.warnlist { margin: 0; padding: 0; list-style: none; display: grid; gap: 3px; font-size: 12.5px; max-height: 92px; overflow: auto; }
.warnlist button { border: 0; background: none; padding: 0; text-align: left; color: var(--warn); font-size: 12.5px; }
.warnlist button:hover { text-decoration: underline; }
.warnlist .gref { font-family: var(--f-mono); font-weight: 600; margin-right: 6px; }

/* ---------- панель действий */
.bar {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 14px; padding: 8px; background: var(--surface);
  border: 1px solid var(--line); border-bottom: 0; border-radius: 12px 12px 0 0;
}
.bar .seltools { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; padding-left: 8px; border-left: 1px solid var(--line); }
.bar .count { font-size: 12.5px; font-weight: 600; color: var(--accent); padding: 0 4px; }
.bar.has-sel .hint { display: none; }
.hint { font-size: 12px; color: var(--muted); margin-left: auto; padding: 0 6px; }
.menu-wrap { position: relative; }
.menu {
  position: absolute; z-index: 40; top: calc(100% + 4px); left: 0; min-width: 230px; background: var(--surface);
  border: 1px solid var(--line-strong); border-radius: 10px; box-shadow: var(--shadow); padding: 4px; display: grid;
}
.menu[hidden] { display: none !important; }
.menu.right { left: auto; right: 0; }
.menu button { border: 0; background: none; text-align: left; padding: 7px 10px; border-radius: 7px; font-size: 13px; display: flex; gap: 8px; align-items: baseline; }
.menu button:hover, .menu button:focus-visible { background: var(--surface-2); outline: none; }
.menu button small { color: var(--muted); font-size: 12px; }
.menu .mh { font-size: 11px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--faint); padding: 6px 10px 2px; }

/* ---------- таблица */
.grid-wrap {
  position: relative; overflow: auto; max-height: calc(100vh - 120px); min-height: 240px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 0 0 12px 12px;
  overscroll-behavior: contain;
}
table.grid { border-collapse: separate; border-spacing: 0; width: 100%; table-layout: fixed; font-size: 13px; }
.grid th, .grid td { border-bottom: 1px solid var(--line); padding: 0; height: 34px; vertical-align: middle; background: var(--surface); }
.grid thead th {
  position: sticky; top: 0; z-index: 6; background: var(--surface-2); height: 30px; padding: 0 6px;
  font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); text-align: left; white-space: nowrap;
  border-bottom: 1px solid var(--line-strong);
}
.grid th.num, .grid td.num { text-align: right; }
.grid .c-h { position: sticky; left: 0; z-index: 3; }
.grid .c-ref { position: sticky; left: 32px; z-index: 3; padding: 0 6px; font: 600 12px var(--f-mono); color: var(--muted); white-space: nowrap; }
.grid tbody tr[data-kind] td.c-ref, .grid tbody tr[data-kind] td.c-num { cursor: grab; touch-action: none; }
.grid .c-num { position: sticky; left: 90px; z-index: 3; padding: 0 6px; border-right: 1px solid var(--line); }
.grid thead .c-h, .grid thead .c-ref, .grid thead .c-num { z-index: 8; }
.grid .c-ir { padding: 0 8px; }
.grid .c-du { padding: 0 8px; }
.grid .c-km { text-align: center; }
.grid .c-act { padding-right: 4px; }
.grid thead .c-ir, .grid thead .c-du { padding: 0 8px; }

/* ячейки-редакторы: выглядят как текст, рамка — при наведении и фокусе */
.cell { display: block; width: 100%; height: 30px; border: 1px solid transparent; border-radius: 6px; background: transparent; padding: 0 6px; font-size: 13px; min-width: 0; }
select.cell { appearance: none; -webkit-appearance: none; padding-right: 20px; cursor: pointer;
  background-image: linear-gradient(45deg, transparent 50%, var(--faint) 50%), linear-gradient(135deg, var(--faint) 50%, transparent 50%);
  background-position: calc(100% - 11px) 13px, calc(100% - 7px) 13px; background-size: 4px 4px; background-repeat: no-repeat; }
.cell:hover { border-color: var(--line-strong); background-color: var(--surface); }
.cell:focus { border-color: var(--accent); background-color: var(--surface); outline: none; box-shadow: 0 0 0 2px var(--accent-soft); }
input.cell.num { text-align: right; }
input.cell::placeholder { color: var(--faint); }
.duo { display: flex; gap: 2px; align-items: center; padding: 0 2px; }
.duo .cell { flex: 1 1 auto; }
.duo .cell.sm { flex: 0 0 76px; }
.duo .cell.xs { flex: 0 0 46px; }
.td-pad { padding: 0 2px; }
.auto { color: var(--muted); }

.handle {
  width: 26px; height: 28px; margin-left: 4px; border: 0; border-radius: 6px; background: transparent; color: var(--faint);
  display: grid; place-items: center; cursor: grab; touch-action: none;
}
.handle:hover { background: var(--surface-3); color: var(--text); }
.handle svg { width: 12px; height: 16px; }
.dragging-on, .dragging-on * { cursor: grabbing !important; user-select: none; -webkit-user-select: none; }

.chip { display: inline-block; font: 600 12px/20px var(--f-mono); padding: 0 7px; border-radius: 5px; white-space: nowrap; }
.s-lo { background: var(--lo-bg); color: var(--lo-fg); }
.s-ls { background: var(--ls-bg); color: var(--ls-fg); }
.s-lao { background: var(--lao-bg); color: var(--lao-fg); }
.s-u { background: var(--u-bg); color: var(--u-fg); }
.chip.changed { animation: chipflash 1.6s ease-out; }
@keyframes chipflash { 0% { box-shadow: 0 0 0 3px var(--accent); } 100% { box-shadow: 0 0 0 0 transparent; } }

/* строки */
.grid tbody tr:hover td { background: var(--surface-2); }
.grid tr.sel td { background: var(--accent-soft) !important; }
.grid tr.sel td.c-h { box-shadow: inset 3px 0 0 var(--accent); }
.grid tr.landed td { animation: landed 1.2s ease-out; }
@keyframes landed { 0% { background: color-mix(in srgb, var(--accent) 22%, var(--surface)); } 100% { } }
.grid tr.ghosted td { opacity: .35; }

/* блок УЗО */
.grid tr.r-u td { background: var(--blk); border-bottom-color: var(--blk-line); }
.grid tr.r-u td.c-h { box-shadow: inset 3px 0 0 var(--blk-line); }
.grid tr.in-blk td { background: color-mix(in srgb, var(--blk) 55%, var(--surface)); }
.grid tr.in-blk td.c-h { box-shadow: inset 3px 0 0 var(--blk-line); }
.grid tr.in-blk td.c-name .cell { padding-left: 18px; }
.grid tr.in-blk td.c-name { background-image: linear-gradient(var(--blk-line), var(--blk-line)); background-size: 8px 1px; background-position: 6px 50%; background-repeat: no-repeat; }
.grid tr.r-end td { height: 26px; background: var(--blk); border-bottom: 2px solid var(--blk-line); }
.grid tr.r-end td.c-h { box-shadow: inset 3px 0 0 var(--blk-line); }
.grid tr.r-end .endtxt { position: sticky; left: 32px; display: inline-flex; align-items: center; gap: 10px; padding: 0 6px; font-size: 12px; color: var(--muted); }
.u-model { font-size: 12.5px; padding: 0 6px; white-space: nowrap; }
.u-model b { font-weight: 600; color: var(--text); }
.lnk { border: 0; background: none; color: var(--accent); font-size: 12px; font-weight: 600; padding: 2px 4px; border-radius: 5px; }
.lnk:hover { background: var(--accent-soft); }

/* ввод */
.grid tr.r-fx td { background: var(--surface-2); color: var(--muted); height: 30px; }
.grid tr.r-fx td.c-fx { padding: 0 6px; font-size: 12.5px; }
.grid tr.r-fx td.c-fx b { color: var(--text); font-weight: 600; }
.grid tr.r-sec td { background: var(--surface-2); height: 30px; }
.sec-btn { position: sticky; left: 0; border: 0; background: none; display: inline-flex; align-items: center; gap: 8px; padding: 0 6px; height: 28px; font-size: 12.5px; color: var(--muted); max-width: 100vw; text-align: left; white-space: nowrap; }
.sec-btn b { color: var(--text); font-weight: 600; }
.sec-btn svg { width: 12px; height: 12px; transition: transform .15s; flex: none; }
.sec-btn[aria-expanded="true"] svg { transform: rotate(90deg); }
.grid tr.r-empty td { height: 120px; text-align: center; color: var(--muted); }

/* фазы */
.phd { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: 0; flex: none; }
.ph-L1 { background: var(--ph1); } .ph-L2 { background: var(--ph2); } .ph-L3 { background: var(--ph3); }
.ph-L123 { background: conic-gradient(var(--ph1) 0 33%, var(--ph2) 0 66%, var(--ph3) 0); }
.phcell { display: flex; align-items: center; padding: 0 2px 0 6px; gap: 0; }
.phcell .cell { padding-left: 4px; }
.phtxt { display: flex; align-items: center; padding: 0 8px; font-size: 13px; color: var(--muted); white-space: nowrap; }

    var run = [];

  /* Деление последовательности на три сплошных участка с наиболее ровной нагрузкой.

  /* ------------------------------------------------------------------ структура: блоки УЗО */
  /* Разбор строк: для каждой группы — её УЗО (или null). Группа 'rcd' без УЗО перед ней — ошибка, normalize чинит. */

    var cur = null;
    st.rows.forEach(function (r) {
      if (r.t === 'u') { cur = r; res.list.push(r); res.members[r.id] = []; res.byRow[r.id] = r.id; return; }

  function normalize(st) {

    B.kup = true;
    if (ROUTES.indexOf(B.route) < 0) B.route = 'Потолок';
    /* 3P-группы не могут стоять под УЗО 2P — выносим сразу за блок */

    function closeBlock() { if (pending.length) { pending.forEach(function (g) { out.push(g); }); pending = []; } cur = null; }
    st.rows.forEach(function (r) {
      if (r.t === 'u') { closeBlock(); cur = r; out.push(r); return; }
      if (r.prot === 'rcd' && cur) {
        if (r.poles === 3 && cur.poles !== 4) { r.prot = 'dif'; pending.push(r); return; }

        return;

      if (r.poles !== 3) r.poles = 1;
      if (!is3) {
        if (r.poles === 3) { r.poles = 1; r.In = stdUp(Math.max(16, r.In * 1.75), STD_IN); r.cable = null; }
        r.phase = 'L';
      } else if (r.poles === 3) r.phase = 'L123';
      else if (r.phase === 'L' || r.phase === 'L123' || !r.phase) r.phase = 'L1';

      if (u && u.poles === 2) { r.phase = u.phase; r.lock = false; }

  /* ABC подряд: так фазы раздаёт трёхфазная гребёнка (L1 L2 L3 L1 …). Цикл идёт через весь щит;

    var P = ['L1', 'L2', 'L3'], B = st.board, bl = blocks(st), load = { L1: 0, L2: 0, L3: 0 }, units = [], cur = null;
    function blk(r) { return bl.byRow[r.id] ? find(st, bl.byRow[r.id]) : null; }
    st.rows.forEach(function (r) {

    function ref(p) { cnt[p]++; return p + cnt[p]; }
    var fixed = [];
    var inPoles = is3 ? (B.inPoles === 4 ? 4 : 3) : 2;
    fixed.push({ id: 'in', kind: 'in', name: 'Вводной автомат', ref: ref('QF'), w: inPoles, In: B.inA, model: fmtModel(is3 ? (inPoles === 4 ? b.a4 : b.a3) : b.a2, B.inA), poles: inPoles });
    if (B.relay) {
      if (is3) ['L1', 'L2', 'L3'].forEach(function (p) { fixed.push({ id: 'rn' + p, kind: 'rn', name: 'Реле напряжения ' + p, ref: ref('KV'), w: 2, In: 63, model: 'Welrok VIP-63', phase: p }); });
      else fixed.push({ id: 'rn1', kind: 'rn', name: 'Реле напряжения', ref: ref('KV'), w: 2, In: 63, model: 'Welrok VIP-63' });
    }

      var fi = stdUp(Math.max(B.inA, 40), [40, 63, 80, 100]);
      fixed.push({ id: 'fire', kind: 'fire', name: 'УЗО противопожарное 100 мА', ref: ref('QD'), w: is3 ? 4 : 2, In: fi, model: fmtModel(is3 ? b.fire4 : b.fire2, fi) });
    }
    if (B.xb) fixed.push({ id: 'xb', kind: 'xb', name: 'Кросс-модуль', ref: ref('XT'), w: is3 ? 5 : 3, model: is3 ? '4П, 125 А' : '2П, 125 А' });
    var useKm = B.km && st.rows.some(function (r) { return r.t === 'g' && r.km; });
    if (useKm) {
      fixed.push({ id: 'c2', kind: 'a1', name: 'Защита катушки КМ', ref: ref('QF'), w: 1, In: 2, model: fmtModel(b.a1, 2) });
      var kt = kmOf(B);
      fixed.push({ id: 'km', kind: 'km', name: 'Контактор «мастер-выключатель»', ref: ref('KM'), w: kt.w, model: kmModel(B, kt), kmType: kt.k, kmAuto: !B.kmType });

        v.sumIr = 0; v.sumP = 0; v.maxIn = 0; v.warn = [];
        counts.u++;
      } else {
        var c = catOf(r);
        nG++;
        v.ser = c.ser; serN[c.ser]++; serCount[c.ser]++;
        v.num = c.ser + '-' + serN[c.ser];
        v.rcd = bl.byRow[r.id];
        var kind;
        if (r.prot === 'dif') { kind = r.poles === 3 ? 'dif4' : 'dif'; v.ref = ref('QFD'); v.w = r.poles === 3 ? 4 : 2; }
        else { kind = r.poles === 3 ? 'a3' : 'a1'; v.ref = ref('QF'); v.w = r.poles === 3 ? 3 : 1; }
        counts[r.prot === 'rcd' ? 'rcd' : r.prot]++;
        v.model = r.prot === 'dif' ? brandModel(B, kind, r.In, r.idn) : fmtModel(b[kind], r.In);
        v.cos = c.cos;
        v.Ir = groupIr(r);
        v.cableAuto = autoCable(r);
        v.cableEff = c.noCable ? null : (r.cable || v.cableAuto);
        v.lenAuto = autoLen(r, B.area);
        v.lenEff = c.noCable ? 0 : (r.len != null ? r.len : v.lenAuto);

        if (v.Ir > r.In + 1e-9) v.warn.push({ f: 'In', t: 'Расчётный ток ' + fmt(v.Ir, 1) + ' А больше номинала ' + r.In + ' А' });

  /* ------------------------------------------------------------------ правки */

    raf = requestAnimationFrame(function step() {
      if (!drag || !drag.started) return;
      var wr = wrap.getBoundingClientRect(), y = drag.y, sp = 0;
      var top = Math.max(wr.top, 0) + 36, bot = Math.min(wr.bottom, window.innerHeight) - 30;
      if (y < top) sp = -Math.min(18, (top - y) / 2 + 2);
      else if (y > bot) sp = Math.min(18, (y - bot) / 2 + 2);
      if (sp) {
        var before = wrap.scrollTop; wrap.scrollTop += sp;
        if (wrap.scrollTop === before) window.scrollBy(0, sp);
        place();
      }
      raf = requestAnimationFrame(step);
    });
  }
  function endDrag() {
    cancelAnimationFrame(raf);
    if (drag && drag.h) {
      drag.h.removeEventListener('pointermove', onMove); drag.h.removeEventListener('pointerup', onUp);
      drag.h.removeEventListener('pointercancel', onCancel); drag.h.removeEventListener('lostpointercapture', onLost);
      try { drag.h.releasePointerCapture(drag.pid); } catch (e) { /* */ }
    }
    document.documentElement.classList.remove('dragging-on');
    rowCache.forEach(function (c) { c.el.classList.remove('ghosted'); });
    dropLine.hidden = true;
    if (ghost) { ghost.remove(); ghost = null; }
  }
  function onUp(e) {
    if (!drag) return;
    var d = drag;
    if (!d.started) {
      endDrag(); drag = null;
      if (d.shift) return;
      if (d.kind === 'u') { clickSelect(d.id, { ctrlKey: d.ctrl, metaKey: false, shiftKey: false }); return; }
      if (d.ctrl) { if (d.was) sel.delete(d.id); }
      else if (d.was) { if (d.size === 1) sel.clear(); else { sel.clear(); sel.add(d.id); } }
      applySel(); renderBar();
      return;
    }
    var t = d.target, ids = d.ids;
    endDrag(); drag = null;
    if (!t) return;
    var before = {}; ids.forEach(function (id) { var v = D.byId[id]; before[id] = { rcd: v.rcd, num: v.num, prot: v.prot }; });
    var changed = false, oldJson = JSON.stringify(state.rows);
    commit(function (st) { return M.moveRows(st, ids, t.a); }, { flip: true });
    changed = JSON.stringify(state.rows) !== oldJson;
    if (!changed) return;
    landRows(d.kind === 'u' ? [d.id].concat(D.byId[d.id].members) : ids);
    if (d.kind === 'g') {
      var a0 = D.byId[ids[0]], b0 = before[ids[0]];
      var what = ids.length > 1 ? ids.length + ' ' + plural(ids.length, 'группа', 'группы', 'групп') : a0.num;
      if (a0.rcd && a0.rcd !== b0.rcd) toast(what + ' — под УЗО ' + D.byId[a0.rcd].ref + '. Номера пересчитаны', true);
      else if (!a0.rcd && b0.rcd) toast(what + ' — вынесены из-под УЗО, ' + (a0.prot === 'dif' ? 'дифавтомат' : 'автомат') + '. Номера пересчитаны', true);
      else toast((b0.num !== a0.num ? b0.num + ' → ' + a0.num : 'Порядок изменён') + '. Номера пересчитаны', true);
    } else toast('УЗО ' + D.byId[d.id].ref + ' перенесено вместе с группами', true);
  }
  function onCancel() { endDrag(); drag = null; }
  function onLost() { if (drag && drag.started) { /* отпускание вне окна */ } }

  /* ================================================================ подсказки */
  var tipFor = null;
  function showTip(el, force) {
    var t = el.getAttribute('data-tip'); if (!t) return;
    if (drag && drag.started) return;
    tipEl.textContent = t; tipEl.hidden = false; tipFor = el;
    tipEl.style.whiteSpace = 'pre-line';
    var r = el.getBoundingClientRect(), w = tipEl.offsetWidth, h = tipEl.offsetHeight;
    var x = Math.max(8, Math.min(window.innerWidth - w - 8, r.left + r.width / 2 - w / 2));
    var y = r.bottom + 6; if (y + h > window.innerHeight - 8) y = r.top - h - 6;
    tipEl.style.left = x + 'px'; tipEl.style.top = y + 'px';
    if (force) { clearTimeout(showTip.t); showTip.t = setTimeout(hideTip, 4000); }
  }
  function hideTip() { tipEl.hidden = true; tipFor = null; }
  var tipTimer = 0;
  document.addEventListener('pointerover', function (e) {
    var el = e.target.closest && e.target.closest('[data-tip]');
    if (el === tipFor) return;
    clearTimeout(tipTimer);
    if (!el) { hideTip(); return; }
    tipTimer = setTimeout(function () { showTip(el); }, el.classList.contains('wbadge') ? 0 : 450);
  });
  document.addEventListener('pointerdown', function () { clearTimeout(tipTimer); });
  window.addEventListener('scroll', hideTip, true);

  /* ================================================================ сообщения */
  var toastT = 0;
  function toast(msg, withUndo) {
    var t = $('toast');
    $('toastTxt').textContent = msg;
    $('toastBtn').hidden = !withUndo;
    t.hidden = false;
    clearTimeout(toastT); toastT = setTimeout(function () { t.hidden = true; }, withUndo ? 6000 : 3200);
  }
  $('toastBtn').addEventListener('click', function () { $('toast').hidden = true; doUndo(); });

  /* ================================================================ клавиатура */
  document.addEventListener('keydown', function (e) {
    var tag = e.target.tagName, inField = tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA';
    var mod = e.ctrlKey || e.metaKey;
    if (e.key === 'Escape') {
      if (drag && drag.started) { onCancel(); return; }
      closeMenus(); hideTip();
      if (!inField && sel.size) { sel.clear(); applySel(); renderBar(); }
      return;
    }
    if (mod && !inField && (e.key === 'z' || e.key === 'Z' || e.key === 'я' || e.key === 'Я')) { e.preventDefault(); if (e.shiftKey) doRedo(); else doUndo(); return; }
    if (mod && !inField && (e.key === 'y' || e.key === 'Y' || e.key === 'н' || e.key === 'Н')) { e.preventDefault(); doRedo(); return; }
    if (inField) return;
    if ((e.key === 'Delete' || e.key === 'Backspace') && sel.size) { e.preventDefault(); delSelected(); return; }
    if (mod && (e.key === 'd' || e.key === 'D' || e.key === 'в' || e.key === 'В') && sel.size) { e.preventDefault(); dupSelected(); return; }
    if (mod && (e.key === 'a' || e.key === 'A' || e.key === 'ф' || e.key === 'Ф')) { e.preventDefault(); sel.clear(); D.rows.forEach(function (v) { if (v.t === 'g') sel.add(v.id); }); applySel(); renderBar(); return; }
    if (e.altKey && (e.key === 'ArrowUp' || e.key === 'ArrowDown') && sel.size) { e.preventDefault(); nudgeSel(e.key === 'ArrowUp' ? -1 : 1); return; }
  });

  /* ================================================================ связь с AutoCAD (панель WebView2 в плагине GIP.bundle)
     страница -> AutoCAD: строка «тип\nJSON» (ready, apply); AutoCAD -> страница: объект {type: load|unlinked|linked, state, doc, origin} */
  var bridgeT = 0;
  var hostS = { linked: false, doc: '', auto: uiS.auto !== false, dirty: false, waiting: !!host };
  function hostPost(type, payload) { if (!host) return; try { host.postMessage(type + '\n' + (payload || '')); } catch (e) { /* */ } }
  function pushNow() { clearTimeout(bridgeT); hostPost('apply', JSON.stringify(state)); hostS.dirty = false; syncHost(); }
  function bridgeSend() {
    if (!host || !hostS.linked) return;
    if (hostS.auto) { clearTimeout(bridgeT); bridgeT = setTimeout(pushNow, 150); }
    else { hostS.dirty = true; syncHost(); }
  }
  function syncHost() {
    if (!host) return;
    var L = $('link');
    L.classList.toggle('on', hostS.linked);
    L.title = hostS.linked ? 'Таблица связана с чертежом ' + hostS.doc : 'В этом чертеже щита ещё нет';
    $('linkTxt').textContent = hostS.waiting ? 'Чтение чертежа…' : (hostS.linked ? 'Чертёж: ' : 'Нет щита: ') + (hostS.doc || 'без имени');
    $('autoWrap').hidden = !hostS.linked;
    $('autoChk').checked = hostS.auto;
    $('pushBtn').hidden = !hostS.linked || (hostS.auto && !hostS.dirty);
    $('pushBtn').classList.toggle('primary', hostS.dirty);
    $('hostBar').hidden = hostS.linked || hostS.waiting;
    $('hostBarTxt').textContent = 'В чертеже «' + (hostS.doc || 'без имени') + '» щита ещё нет. Таблица ниже — последняя, с которой вы работали; соберите нужную и постройте альбом. Нужен чертёж из шаблона ГИП.';
  }
  if (host) {
    host.addEventListener('message', function (ev) {
      var m = ev.data;
      if (typeof m === 'string') { try { m = JSON.parse(m); } catch (e) { return; } }
      if (!m || !m.type) return;
      if (m.type === 'load' && m.state && Array.isArray(m.state.rows)) {
        var ns;
        try { ns = M.normalize(m.state); } catch (e) { toast('Не удалось прочитать щит из чертежа'); return; }
        if (m.origin === 'activate') { undoS = []; redoS = []; sel.clear(); }
        else if (JSON.stringify(ns) !== JSON.stringify(state)) { undoS.push(JSON.stringify(state)); redoS = []; }
        var wasLinked = hostS.linked;
        state = ns; hostS.linked = true; hostS.waiting = false; hostS.doc = m.doc || ''; hostS.dirty = false;
        render({ flip: m.origin === 'drawing' }); syncHost();
        if (m.origin === 'drawing' && wasLinked) toast('Таблица обновлена по чертежу', true);
      } else if (m.type === 'linked') {
        hostS.linked = true; hostS.waiting = false; if (m.doc) hostS.doc = m.doc; syncHost(); toast('Альбом построен, таблица связана с чертежом');
      } else if (m.type === 'unlinked') {
        hostS.linked = false; hostS.waiting = false; hostS.doc = m.doc || ''; hostS.dirty = false; syncHost();
      }
    });
    $('autoChk').addEventListener('change', function (e) {
      hostS.auto = e.target.checked; uiS.auto = hostS.auto; lsSet(LS_UI, uiS);
      if (hostS.auto && hostS.dirty) pushNow(); else syncHost();
    });
    $('pushBtn').addEventListener('click', pushNow);
    $('buildHere').addEventListener('click', function () { pushNow(); toast('Строю альбом в чертеже…'); });
  }

  /* ================================================================ старт */
  $('undo').innerHTML = I.undo; $('redo').innerHTML = I.redo;
  $('undo').addEventListener('click', doUndo); $('redo').addEventListener('click', doRedo);
  $('tplBtn').addEventListener('click', function () { toggleTpl(); });
  state = initState();
  buildBoard(); buildBar(); resetTplForm(); buildTpl();
  render({});
  if (host) { syncHost(); hostPost('ready', ''); }
  window.GIP = {
    get state() { return state; }, get derived() { return D; }, commit: commit, M: M,
    select: function (ids) { sel.clear(); ids.forEach(function (i) { sel.add(i); }); applySel(); renderBar(); }
  };
})();

</script>
